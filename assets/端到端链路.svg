<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" font-family="'Microsoft YaHei','SimHei',sans-serif">
  <defs>
    <marker id="arw" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#34495e"/>
    </marker>
  </defs>

  <!-- 发射端 -->
  <rect x="18" y="96" width="150" height="104" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="93" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">发射端 TX</text>
  <text x="93" y="150" text-anchor="middle" font-size="12" fill="#3d3d3d">目标特征磁场</text>
  <text x="93" y="172" text-anchor="middle" font-size="12.5" fill="#3d3d3d">A·cos(ωt+φ)</text>
  <text x="93" y="192" text-anchor="middle" font-size="10.5" fill="#7f8c8d">A、φ、ω 均未知</text>

  <!-- 透镜/衰减 -->
  <line x1="168" y1="148" x2="248" y2="148" stroke="#34495e" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="208" y="132" text-anchor="middle" font-size="10.5" fill="#5d6d7e">衰减 1/r³</text>
  <text x="208" y="168" text-anchor="middle" font-size="10.5" fill="#5d6d7e">传播相位</text>

  <!-- 信道 -->
  <rect x="250" y="80" width="176" height="136" rx="10" fill="#eef4fb" stroke="#2c7fb8" stroke-width="1.8"/>
  <text x="338" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c7fb8">信道</text>
  <text x="338" y="134" text-anchor="middle" font-size="12" fill="#3d3d3d">环境磁噪声</text>
  <text x="338" y="154" text-anchor="middle" font-size="11" fill="#7f8c8d">白噪 / 1/f 色噪</text>
  <text x="338" y="178" text-anchor="middle" font-size="12" fill="#3d3d3d">ADC 量化</text>
  <text x="338" y="198" text-anchor="middle" font-size="10.5" fill="#7f8c8d">σ 为噪声强度</text>

  <!-- 到接收端 -->
  <line x1="426" y1="148" x2="506" y2="148" stroke="#34495e" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="466" y="132" text-anchor="middle" font-size="10.5" fill="#5d6d7e">采样序列</text>
  <text x="466" y="168" text-anchor="middle" font-size="10.5" fill="#5d6d7e">s[i]，间隔 dt</text>

  <!-- 接收端容器 -->
  <rect x="508" y="52" width="252" height="196" rx="12" fill="none" stroke="#1e8449" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="634" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">接收端 RX（只拿到 s[i] 与 dt）</text>

  <rect x="524" y="86" width="220" height="38" rx="7" fill="#eafaf1" stroke="#1e8449" stroke-width="1.2"/>
  <text x="634" y="110" text-anchor="middle" font-size="12" fill="#145a32">① FFT 粗估 ω̂（误差 ~0.002%）</text>

  <rect x="524" y="130" width="220" height="38" rx="7" fill="#eafaf1" stroke="#1e8449" stroke-width="1.2"/>
  <text x="634" y="154" text-anchor="middle" font-size="12" fill="#145a32">② 变尺度细扫 R → R̂=ω（±1% 内）</text>

  <rect x="524" y="174" width="220" height="60" rx="7" fill="#eafaf1" stroke="#1e8449" stroke-width="1.2"/>
  <text x="634" y="195" text-anchor="middle" font-size="12" fill="#145a32">③ 三相位阵列 pstd 判态</text>
  <text x="634" y="214" text-anchor="middle" font-size="11" fill="#145a32">pstd&lt;门限 → 有目标</text>
  <text x="634" y="229" text-anchor="middle" font-size="11" fill="#145a32">λ* 差分 → γ̂、θ̂</text>

  <!-- 判决输出 -->
  <line x1="760" y1="148" x2="812" y2="148" stroke="#34495e" stroke-width="1.8" marker-end="url(#arw)"/>
  <rect x="814" y="112" width="128" height="72" rx="10" fill="#f4f6f7" stroke="#34495e" stroke-width="1.8"/>
  <text x="878" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">判决输出</text>
  <text x="878" y="162" text-anchor="middle" font-size="12" fill="#c0392b">有目标 / 无目标</text>
  <text x="878" y="178" text-anchor="middle" font-size="10.5" fill="#7f8c8d">+ ω̂、γ̂、θ̂</text>

  <!-- 底部注 -->
  <line x1="18" y1="272" x2="942" y2="272" stroke="#d5dbdb" stroke-width="1"/>
  <text x="18" y="294" font-size="11.5" fill="#5d6d7e">核心：接收端不知道 ω。变尺度系数 R 由序列自身扫出——扫到 R=ω 时，序列角频率在新时间轴上恰为 1，与内驱共振，pstd 从 ~0.4 塌到 1e-5。</text>
  <text x="18" y="314" font-size="11.5" fill="#5d6d7e">单振子存在相位盲区（λ0+A·cosθ 须越过 λc≈0.7335），故接收端用 β=0、±120° 三相位阵列，取 min pstd（OR 融合）。</text>
</svg>
